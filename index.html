    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="icons/icon-512.png" />

    <script>
      // Immediate theme bootstrap to prevent screen flashing
      try {
        var rawSettings = localStorage.getItem('ky_settings_v2');
        if (rawSettings) {
          var parsed = JSON.parse(rawSettings);
          if (parsed && parsed.theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {
        document.documentElement.classList.remove('dark');
      }
    </script>
  </head>
  <body class="bg-white dark:bg-[#0B132B] text-slate-900 dark:text-slate-100 antialiased selection:bg-blue-600/20 selection:text-blue-700 transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
